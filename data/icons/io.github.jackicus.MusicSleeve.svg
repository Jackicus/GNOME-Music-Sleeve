  <!-- A dot-matrix display whose lit dots draw a double note, in GNOME's palette: a dark
       panel, its unlit dots dim and its lit ones yellow to orange. A 14 by 14 grid without its
       four corner dots, so it sits inside the panel's rounded corners. The note is the app's
       own: an LED pattern on a dark panel, nothing like another player's mark. -->
  <defs>
    <linearGradient id="led" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="114">
      <stop offset="0" stop-color="#f8e45c"/>
      <stop offset="1" stop-color="#ff7800"/>
    </linearGradient>
  </defs>
  <!-- The panel, with a faint light edge so it holds its shape on a dark background. -->
  <rect x="8" y="8" width="112" height="112" rx="16" fill="#241f31"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="15.5" fill="none" stroke="#ffffff"
        stroke-opacity="0.12"/>
